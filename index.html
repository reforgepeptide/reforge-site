<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>REFORGE</title>
  <meta name="description" content="Reforge luxury brand website" />

  <style>
    :root{
      --bg:#f4f7ff;
      --bg-2:#eef3ff;
      --white:#ffffff;
      --text:#122033;
      --muted:#5f7088;
      --line:rgba(25,44,83,.08);

      --blue:#4b7cff;
      --cyan:#45d0ff;
      --violet:#7d5cff;
      --pink:#ff71b8;
      --orange:#ffab66;
      --teal:#39d7bf;

      --grad-main:linear-gradient(135deg,#4b7cff 0%, #7d5cff 36%, #ff71b8 72%, #ffab66 100%);
      --grad-soft:linear-gradient(135deg, rgba(75,124,255,.16), rgba(125,92,255,.12), rgba(255,113,184,.10));
      --glass:rgba(255,255,255,.62);
      --glass-2:rgba(255,255,255,.76);

      --shadow-xl:0 30px 80px rgba(43,72,132,.16);
      --shadow-lg:0 18px 44px rgba(43,72,132,.12);
      --shadow-md:0 10px 28px rgba(43,72,132,.10);

      --radius-xl:40px;
      --radius-lg:28px;
      --radius-md:18px;
      --max:1220px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 0% 0%, rgba(75,124,255,.20), transparent 30%),
        radial-gradient(circle at 100% 0%, rgba(255,113,184,.16), transparent 28%),
        radial-gradient(circle at 100% 100%, rgba(57,215,191,.12), transparent 25%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      min-height:100vh;
      overflow-x:hidden;
    }

    a{color:inherit;text-decoration:none}
    img{display:block;max-width:100%}

    .container{
      width:min(var(--max), calc(100% - 32px));
      margin:0 auto;
      position:relative;
      z-index:1;
    }

    .bg-orb,
    .bg-orb-2,
    .bg-orb-3{
      position:fixed;
      border-radius:50%;
      filter:blur(42px);
      pointer-events:none;
      z-index:0;
    }

    .bg-orb{
      width:260px;
      height:260px;
      left:-80px;
      top:80px;
      background:rgba(75,124,255,.18);
    }

    .bg-orb-2{
      width:280px;
      height:280px;
      right:-90px;
      top:120px;
      background:rgba(255,113,184,.16);
    }

    .bg-orb-3{
      width:220px;
      height:220px;
      right:10%;
      bottom:60px;
      background:rgba(57,215,191,.14);
    }

    .topbar{
      position:sticky;
      top:0;
      z-index:100;
      background:rgba(244,247,255,.68);
      backdrop-filter:blur(18px);
      border-bottom:1px solid rgba(18,32,51,.05);
    }

    .topbar-inner{
      width:min(var(--max), calc(100% - 32px));
      margin:0 auto;
      min-height:84px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:14px;
      min-width:0;
    }

    .brand img{
      width:64px;
      height:64px;
      object-fit:contain;
      border-radius:18px;
      padding:7px;
      background:
        linear-gradient(135deg, rgba(75,124,255,.14), rgba(125,92,255,.10), rgba(255,113,184,.08)),
        #fff;
      box-shadow:var(--shadow-md);
    }

    .brand-mini{
      color:var(--muted);
      font-size:10px;
      letter-spacing:3px;
      text-transform:uppercase;
      margin-bottom:6px;
    }

    .brand-name{
      font-size:30px;
      font-weight:900;
      line-height:1;
      letter-spacing:5px;
      text-transform:uppercase;
      background:var(--grad-main);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }

    .nav{
      display:flex;
      align-items:center;
      gap:22px;
      flex-wrap:wrap;
    }

    .nav a{
      font-size:12px;
      font-weight:800;
      letter-spacing:1.8px;
      text-transform:uppercase;
      color:#44566f;
      transition:.2s ease;
    }

    .nav a:hover,
    .nav a.active{
      color:var(--blue);
    }

    .actions{
      display:flex;
      gap:12px;
      align-items:center;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:50px;
      padding:0 20px;
      border-radius:16px;
      border:1px solid rgba(27,46,84,.08);
      background:rgba(255,255,255,.84);
      color:#22334b;
      font-size:13px;
      font-weight:800;
      letter-spacing:1.2px;
      text-transform:uppercase;
      cursor:pointer;
      transition:.2s ease;
      box-shadow:var(--shadow-md);
      backdrop-filter:blur(12px);
    }

    .btn:hover{
      transform:translateY(-1px);
      box-shadow:var(--shadow-lg);
    }

    .btn.primary{
      border:none;
      color:#fff;
      background:var(--grad-main);
      box-shadow:0 16px 36px rgba(113,92,255,.26);
    }

    .menu-toggle{
      display:none;
      width:50px;
      height:50px;
      border:none;
      border-radius:16px;
      background:rgba(255,255,255,.84);
      box-shadow:var(--shadow-md);
      cursor:pointer;
      position:relative;
    }

    .menu-toggle span,
    .menu-toggle:before,
    .menu-toggle:after{
      content:"";
      position:absolute;
      left:14px;
      right:14px;
      height:2px;
      background:#23344c;
      border-radius:999px;
      transition:.2s ease;
    }

    .menu-toggle span{ top:24px; }
    .menu-toggle:before{ top:17px; }
    .menu-toggle:after{ top:31px; }

    .menu-toggle.open span{ opacity:0; }
    .menu-toggle.open:before{ transform:translateY(7px) rotate(45deg); }
    .menu-toggle.open:after{ transform:translateY(-7px) rotate(-45deg); }

    .mobile-nav{
      display:none;
      width:min(var(--max), calc(100% - 32px));
      margin:0 auto 14px;
      padding:14px;
      border-radius:24px;
      background:rgba(255,255,255,.80);
      border:1px solid rgba(255,255,255,.85);
      box-shadow:var(--shadow-lg);
      backdrop-filter:blur(18px);
    }

    .mobile-nav.open{ display:block; }

    .mobile-nav a{
      display:block;
      padding:14px 12px;
      border-radius:14px;
      font-size:13px;
      font-weight:800;
      letter-spacing:1.3px;
      text-transform:uppercase;
      color:#33465f;
    }

    .mobile-nav a:hover{
      background:rgba(75,124,255,.08);
      color:var(--blue);
    }

    .hero{
      padding:34px 0 18px;
    }

    .hero-shell{
      position:relative;
      overflow:hidden;
      border-radius:46px;
      border:1px solid rgba(255,255,255,.64);
      background:
        radial-gradient(circle at 8% 12%, rgba(75,124,255,.16), transparent 24%),
        radial-gradient(circle at 92% 12%, rgba(255,113,184,.16), transparent 22%),
        radial-gradient(circle at 84% 84%, rgba(57,215,191,.14), transparent 24%),
        linear-gradient(180deg, rgba(255,255,255,.68), rgba(249,251,255,.78));
      backdrop-filter:blur(18px);
      box-shadow:var(--shadow-xl);
    }

    .hero-shell:before,
    .hero-shell:after{
      content:"";
      position:absolute;
      border-radius:50%;
      pointer-events:none;
      filter:blur(10px);
    }

    .hero-shell:before{
      width:300px;
      height:300px;
      top:-90px;
      right:-60px;
      background:radial-gradient(circle, rgba(125,92,255,.18), transparent 68%);
    }

    .hero-shell:after{
      width:240px;
      height:240px;
      left:-70px;
      bottom:-70px;
      background:radial-gradient(circle, rgba(69,208,255,.16), transparent 68%);
    }

    .hero-grid{
      display:grid;
      grid-template-columns:1.1fr .9fr;
      gap:28px;
      align-items:center;
      padding:58px;
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:8px;
      min-height:38px;
      padding:0 14px;
      border-radius:999px;
      background:rgba(255,255,255,.78);
      border:1px solid rgba(27,46,84,.06);
      box-shadow:var(--shadow-md);
      color:#314661;
      font-size:12px;
      font-weight:800;
      letter-spacing:1px;
      text-transform:uppercase;
      backdrop-filter:blur(12px);
    }

    .eyebrow-dot{
      width:8px;
      height:8px;
      border-radius:50%;
      background:var(--grad-main);
    }

    h1{
      margin:18px 0 0;
      font-size:clamp(56px, 8vw, 108px);
      line-height:.9;
      letter-spacing:4px;
      text-transform:uppercase;
      color:#16253a;
    }

    .hero-sub{
      margin-top:12px;
      font-size:15px;
      letter-spacing:12px;
      text-transform:uppercase;
      color:#6a7b93;
    }

    .hero-copy{
      margin-top:22px;
      max-width:640px;
      color:#53657d;
      font-size:15px;
      line-height:1.9;
    }

    .hero-actions{
      display:flex;
      gap:14px;
      flex-wrap:wrap;
      margin-top:32px;
    }

    .hero-pills{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      margin-top:24px;
    }

    .hero-pill{
      display:inline-flex;
      align-items:center;
      min-height:40px;
      padding:0 14px;
      border-radius:999px;
      background:rgba(255,255,255,.74);
      border:1px solid rgba(27,46,84,.06);
      box-shadow:var(--shadow-md);
      color:#314661;
      font-size:12px;
      font-weight:800;
      letter-spacing:1px;
      text-transform:uppercase;
      backdrop-filter:blur(12px);
    }

    .hero-card{
      position:relative;
      min-height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:42px;
      border-radius:34px;
      background:
        linear-gradient(135deg, rgba(75,124,255,.16), rgba(125,92,255,.10) 34%, rgba(255,113,184,.10) 70%, rgba(255,255,255,.90) 100%),
        #fff;
      border:1px solid rgba(255,255,255,.82);
      box-shadow:var(--shadow-lg);
      overflow:hidden;
      backdrop-filter:blur(14px);
    }

    .hero-card:before{
      content:"";
      position:absolute;
      left:-70px;
      bottom:-70px;
      width:220px;
      height:220px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(255,171,102,.20), transparent 68%);
    }

    .hero-card:after{
      content:"";
      position:absolute;
      top:-40px;
      right:-40px;
      width:170px;
      height:170px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(69,208,255,.16
